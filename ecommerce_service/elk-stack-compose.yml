version: '3.7'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m  # Lower RAM usage
    ports:
      - "9200:9200"
    volumes:
      - /home/admin/elasticsearch/data:/usr/share/elasticsearch/data
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.9
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m  # Lower RAM usage
    volumes:
      - /home/admin/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    ports:
      - "5044:5044"
    networks:
      - elk

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.9
    container_name: filebeat
    user: root
    volumes:
      - /home/admin/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /home/admin/logs/:/home/admin/logs/:ro
      - /home/admin/celery/logs/:/home/admin/celery/logs/:ro
    depends_on:
      - logstash
    networks:
      - elk

networks:
  elk:
    driver: bridge
